<title>Doremi - Giao tận cửa Centery (06:30-23:00)</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
  
*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  font-family:'Inter',Arial,sans-serif;
  background:#f7f7f7;
  color:#1f2937;
  -webkit-font-smoothing:antialiased;
}
body{padding-bottom:80px;}
input,select,button,textarea{font-size:16px!important;-webkit-text-size-adjust:100%;touch-action:manipulation;}

/* ── APP SHELL ── */
.app{max-width:430px;margin:0 auto;background:#fff;min-height:100vh;}

/* ── TOPBAR ── */
.topbar{position:sticky;top:0;z-index:60;background:#fff;border-bottom:1px solid #f0e7c8;padding:10px 14px;}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.brand{display:flex;align-items:center;gap:8px;}
.logo{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#ffb03a,#ff8a00);color:#fff;font-weight:800;font-size:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.brand-text h1{font-size:19px;color:#a85700;line-height:1.1;margin:0;}
.cart-btn{border:none;border-radius:999px;background:#f6a400;color:#fff;padding:10px 14px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap;}
.cart-count{width:20px;height:20px;border-radius:50%;background:#fff;color:#f6a400;display:inline-flex;align-items:center;justify-content:center;font-size:12px!important;font-weight:800;}

/* ── SEARCH + CATEGORY ── */
.search-wrap{
  padding:20px 18px 16px;
  position:relative;
}

.search-wrap::before{
  content:"";
  position:absolute;
  left:36px;
  top:38px;
  width:12px;
  height:12px;
  border:2px solid #64748b;
  border-radius:50%;
  z-index:2;
}

.search-wrap::after{
  content:"";
  position:absolute;
  left:48px;
  top:50px;
  width:8px;
  height:2px;
  background:#64748b;
  border-radius:99px;
  transform:rotate(45deg);
  z-index:2;
}

.search-input{
  width:100%;
  height:56px;
  border:1.5px solid #e9e6e2;
  border-radius:999px;
  background:#faf9f7;
  padding:0 20px 0 50px;
  color:#111827;
  outline:none;
  font-size:16px!important;
  font-weight:400;
  box-shadow:none;
}

.search-input::placeholder{
  color:#9ca3af;
  opacity:1;
}

.search-input:focus{
  background:#fff;
  border:2px solid #f4b29b;
  box-shadow:0 0 0 4px rgba(244,178,155,.18);
}


/* ── SECTION ── */
.section{padding:0;}
.section.hidden-by-search{display:none!important;}
.section-head{display:flex;align-items:center;gap:8px;padding:12px 16px;margin:12px 12px 0;background:#fffaf3;
border:1px solid #f6d6a8;border-radius:14px;cursor:pointer;scroll-margin-top:70px;box-shadow:0 2px 8px rgba(246,164,0,.15);}
.section-title{
  font-size:17px;
  font-weight:800;
  letter-spacing:-0.03em;
}
.section-arrow{display:none;}
.section.collapsed .item-grid{display:none;}
.section-pill{background:#f6a400;color:#fff;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;white-space:nowrap;margin-left:auto;transition:background .15s;}
.section.collapsed .section-pill{background:#fff;color:#f6a400;border:1.5px solid #f6a400;}
.section-pill-text-open{display:inline;}
.section-pill-text-close{display:none;}
.section.collapsed .section-pill-text-open{display:none;}
.section.collapsed .section-pill-text-close{display:inline;}


/* ── ITEM GRID 2 CỘT GRABFOOD ── */
.item-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 12px 4px;background:transparent;}
.item-card{
  background:#fff;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 4px 14px rgba(15,23,42,.05);
  transition:all .22s ease;
  border:1px solid #f3f4f6;
}
.item-card:active{opacity:.85;}
.item-card.hidden-by-search{display:none!important;}

/* Ảnh chiếm toàn bộ top */
.card-img{
  width:100%;
  aspect-ratio:1/1;
  overflow:hidden;
  background:#fff7e8;
  position:relative;
  border-radius:22px 22px 0 0;
}

.card-img img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;

  transition:transform .35s ease;
}

/* placeholder */
.card-img-placeholder{
  width:100%;
  aspect-ratio:1/1;
  background:#fff7e8;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:700;
  color:#c8a96a;
}

/* hiệu ứng hover card */
.item-card{
  transition:.25s ease;
  overflow:hidden;
}

.item-card:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 24px rgba(0,0,0,.08);
}

/* zoom ảnh khi hover */
.item-card:hover .card-img img{
  transform:scale(1.04);
}

/* Badge số lượng trong giỏ — góc trái dưới ảnh */
.card-qty-badge{position:absolute;bottom:8px;left:8px;min-width:26px;height:26px;border-radius:999px;background:#f6a400;color:#fff;font-size:13px!important;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 6px;box-shadow:0 2px 6px rgba(0,0,0,.2);}
.card-qty-badge.show{display:flex;}

/* Nút + góc phải dưới ảnh */
.card-plus{
  position:absolute;
  bottom:8px;
  right:8px;
  width:30px;
  height:30px;
  border-radius:50%;
  background:#f6a400;
  color:#fff;
  font-size:22px!important;
  font-weight:300;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
  border:1px solid rgba(255,255,255,.85);
  cursor:pointer;
  line-height:1;

  transition:
    transform .18s ease,
    box-shadow .18s ease,
    background .18s ease,
    border-color .18s ease;
}
.card-qty-controls{position:absolute;bottom:8px;right:6px;display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.95);border-radius:999px;padding:3px 6px;box-shadow:0 2px 8px rgba(0,0,0,.18);}
    .card-plus:hover{
  transform:scale(1.05);
  background:#ffb300;
  border-color:#fff;
  box-shadow:0 6px 14px rgba(246,164,0,.22);
}
.card-qbtn{width:26px;height:26px;border-radius:50%;border:none;background:#f6a400;color:#fff;font-size:16px!important;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1;padding:0;flex-shrink:0;}
.card-qnum{font-size:13px!important;font-weight:800;color:#a85700;min-width:16px;text-align:center;}
.card-plus:active{
  transform:scale(.92);
}
.card-note{width:100%;padding:5px 8px;border:1px solid #f0d9a6;border-radius:8px;font-size:12px;background:#fffdf8;color:#333;outline:none;margin-top:6px;resize:none;}
.card-note:focus{border-color:#f6a400;}
body.dark-mode .card-note{background:#111827;border-color:#374151;color:#e5e7eb;}
.card-select{width:100%;padding:5px 8px;border:1px solid #f0d9a6;border-radius:8px;font-size:12px;background:#fffdf8;color:#333;outline:none;margin-top:6px;}
.card-select:focus{border-color:#f6a400;}
body.dark-mode .card-select{background:#111827;border-color:#374151;color:#e5e7eb;}

/* Info bên dưới ảnh */
.card-info{padding:8px 10px 12px;}
.card-name{font-size:14px;font-weight:700;color:#1f2937;line-height:1.35;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-price{font-size:14px;font-weight:800;color:#d88900;}

/* ── BOTTOM SHEET (POPUP) ── */
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;opacity:0;pointer-events:none;transition:opacity .25s;}
.sheet-overlay.open{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:50%;transform:translateX(-50%) translateY(100%);bottom:0;width:100%;max-width:430px;background:#fff;border-radius:20px 20px 0 0;z-index:201;transition:transform .3s cubic-bezier(.32,0,.67,0);max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.sheet.open{transform:translateX(-50%) translateY(0);}

.sheet-handle{width:40px;height:4px;border-radius:999px;background:#e0e0e0;margin:12px auto 0;}
.sheet-img{width:80px;height:80px;object-fit:cover;border-radius:12px;flex-shrink:0;}
.sheet-img-placeholder{width:80px;height:80px;background:#fff7e8;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#c8a96a;flex-shrink:0;}
.sheet-body{padding:16px 16px 28px;}
.sheet-name{font-size:12px;font-weight:700;color:#1f2937;}
.sheet-cart-summary{background:#fff8e1;border:1px solid #f6c84a;border-radius:10px;padding:8px 12px;margin-top:8px;font-size:12px;color:#a85700;}
.sheet-cart-summary-title{font-weight:700;margin-bottom:4px;font-size:12px;}
.sheet-cart-row{display:flex;justify-content:space-between;padding:2px 0;font-size:12px;color:#7a4a00;}
.sheet-price{font-size:17px;font-weight:800;color:#d88900;white-space:nowrap;}

.sheet-label{font-size:14px;font-weight:700;color:#555;margin:12px 0 4px;}
.sheet-select{width:100%; height:50px;border:1px solid #eadfd8;border-radius:999px;padding:0 18px;color:#111827;font-size:16px!important;outline:none;}
.sheet-select:focus{border-color:#f6a400;}
.sheet-input{width:100%;padding:8px 12px;border:1.5px solid #e8dcba;border-radius:10px;font-size:15px;background:#fff;outline:none;color:#333;}
.sheet-input:focus{border-color:#f6a400;}

/* Upsell trong sheet */
.sheet-upsell-label{font-size:14px;font-weight:700;color:#555;margin:12px 0 4px;}
.upsell-list{display:flex;flex-direction:column;gap:8px;}
.upsell-row{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border:1.5px solid #e8e8e8;border-radius:12px;cursor:pointer;transition:all .15s;}
.upsell-row.selected{border-color:#f6a400;background:#fff8e1;}
.upsell-row:active{opacity:.75;}
.upsell-row-left{display:flex;align-items:center;gap:10px;}
.upsell-check{width:22px;height:22px;border-radius:6px;border:2px solid #ccc;display:flex;align-items:center;justify-content:center;font-size:12px!important;color:transparent;flex-shrink:0;transition:all .15s;}
.upsell-row.selected .upsell-check{background:#f6a400;border-color:#f6a400;color:#fff;}
.upsell-row-name{font-size:15px;font-weight:500;color:#222;}
.upsell-row.selected .upsell-row-name{color:#a85700;}
.upsell-row-price{font-size:13px;font-weight:700;color:#f6a400;}

/* Sheet qty + CTA */
.sheet-footer{display:flex;align-items:center;gap:12px;margin-top:18px;padding:14px 0 calc(16px + env(safe-area-inset-bottom));border-top:1px solid #f0e7c8;position:sticky;bottom:0;background:#fff;}
.sheet-qty-row{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.sheet-qty-btn{width:34px;height:34px;border-radius:50%;border:2px solid #f6a400;background:#fff;color:#f6a400;font-size:22px!important;font-weight:300;display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1;}
.sheet-qty-btn:active{background:#fff8e1;}
.sheet-qty-num{font-size:16px;font-weight:800;min-width:24px;text-align:center;color:#333;}
.sheet-add-btn{
  flex:1;
  height:58px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:none;
  border-radius:999px;

  background:linear-gradient(135deg,#ff6a3d,#e63d7a);

  color:#fff !important;
  font-size:17px;
  font-weight:800;
  text-align:center;
  line-height:1;

  box-shadow:0 10px 24px rgba(255,90,70,.22);

  white-space:nowrap;

  transition:.2s ease;
}
.sheet-add-btn:active{opacity:.85;}

/* ── MINI BILL ── */
.mini-bill{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;background:#fff;border-top:1px solid #eadfb8;padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:70;box-shadow:0 -4px 16px rgba(0,0,0,.06);}
.mini-bill-inner{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.mini-bill-top{font-size:14px;font-weight:800;color:#9b4e00;}
.mini-bill-sub{font-size:12px;color:#777;margin-top:2px;}
.mini-bill-last{font-size:12px;color:#8a6a2f;margin-top:3px;font-weight:600;}
.mini-bill-btn{border:none;background:linear-gradient(135deg,#ffb300,#ff8f00);color:#fff;border-radius:14px;padding:12px 16px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;box-shadow:0 4px 12px rgba(255,152,0,.35);}
@keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(-2px)}50%{transform:translateX(2px)}75%{transform:translateX(-2px)}100%{transform:translateX(0)}}
.mini-bill-btn.shake{animation:shake .4s;}

/* ── BILL PANEL ── */
.bill-panel{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;width:calc(100% - 16px);max-width:414px;max-height:72vh;overflow:auto;background:#fff;border:1px solid #eadfb8;border-radius:18px;box-shadow:0 16px 32px rgba(0,0,0,.18);z-index:80;display:none;}
.bill-head{position:sticky;top:0;background:#fffdf8;border-bottom:1px solid #f0e7c8;padding:14px;display:flex;justify-content:space-between;align-items:center;}
.bill-head h3{margin:0;font-size:18px;color:#9b4e00;}
.close-btn{border:none;background:transparent;font-size:24px;cursor:pointer;color:#888;}
.bill-body{padding:14px;}
.bill-empty{font-size:14px;color:#888;padding:8px 0;}
.bill-item{border-bottom:1px dashed #eadfb8;padding:10px 0;}
.bill-item-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:4px;}
.bill-item-name{font-size:14px;font-weight:700;}
.bill-item-price{font-size:14px;font-weight:800;color:#a85700;white-space:nowrap;}
.bill-item-note{font-size:12px;color:#777;line-height:1.5;}
.bill-total{margin-top:10px;padding-top:12px;border-top:1px solid #eadfb8;display:flex;justify-content:space-between;font-size:16px;font-weight:800;}
.customer-box{display:grid;gap:10px;margin-top:14px;}
.input{width:100%;padding:10px 12px;border:1px solid #e8dcba;border-radius:12px;font-size:15px;background:#fff;outline:none;}
.btn{border:none;border-radius:12px;padding:13px 12px;font-size:15px;font-weight:700;cursor:pointer;width:100%;margin-top:10px;}
.btn-save-sheet{
  width:100%;
  height:56px;
  border:none;
  border-radius:18px;
  background:linear-gradient(135deg,#ff6b4a,#e9407a);
  color:#fff;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 10px 24px rgba(233,64,122,.22);
  transition:.2s;
}

.btn-save-sheet:hover{
  transform:translateY(-1px);
  box-shadow:0 14px 28px rgba(233,64,122,.28);
}

.btn-save-sheet:active{
  transform:scale(.98);
}
.btn-back-menu{background:#fff;color:#a85700;border:1.5px solid #f6a400;}
.btn-clear{background:#fee2e2;color:#dc2626;border:1px solid #fecaca;}

/* ── FLOAT BTN ── */
.float-actions{position:fixed;right:14px;bottom:90px;z-index:65;opacity:0;transform:translateY(20px);pointer-events:none;transition:all .25s;}
.float-actions.show{opacity:1;transform:translateY(0);pointer-events:auto;}
.fab{
  position:fixed;
  right:18px;
  bottom:92px;

  width:54px;
  height:54px;

  border:none;
  border-radius:50%;

  background:#fff;
  color:#ff5a3d;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:24px;
  font-weight:700;

  box-shadow:0 10px 24px rgba(15,23,42,.12);

  z-index:999;

  cursor:pointer;
  transition:.2s ease;
}

.fab:hover{
  transform:translateY(-2px);
  box-shadow:0 14px 28px rgba(15,23,42,.18);
}

/* ── LOADING ── */
.loading-overlay{position:fixed;inset:0;background:#fff;z-index:9999;display:flex;align-items:center;justify-content:center;font-weight:800;color:#a85700;font-size:16px;}

/* ── CAPTURE (ẩn) ── */
.capture-wrap{position:fixed;left:-9999px;top:0;width:400px;z-index:-1;}
.capture-box{background:#fff;border-radius:20px;padding:18px;width:380px;font-family:Arial,sans-serif;}
.capture-head{text-align:center;margin-bottom:15px;}
.capture-head h2{margin:0;color:#c46a00;font-size:18px;}
.capture-head p{font-size:13px;color:#888;margin-top:5px;}
.capture-info{background:#f7f2e8;border-radius:12px;padding:10px;font-size:13px;margin-bottom:12px;}
.capture-total{display:flex;justify-content:space-between;font-weight:bold;border-top:1px solid #eee;padding-top:10px;margin-top:10px;}
#captureTotal{color:#c46a00;font-size:16px;}
.capture-qr{text-align:center;margin-top:20px;padding-top:15px;border-top:1px solid #eee;}
.capture-qr img{max-width:180px;border:1px solid #ddd;padding:5px;border-radius:8px;}
.item-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;border-bottom:1px solid #eee;padding-bottom:6px;gap:8px;}
.item-name{font-weight:bold;font-size:14px;flex:1;min-width:0;}
.item-note{font-size:12px;color:#777;margin-top:2px;}

/* ── DARK MODE ── */
body.dark-mode{background:#111827;color:#e5e7eb;}
body.dark-mode .app,body.dark-mode .topbar,body.dark-mode .category-bar,body.dark-mode .mini-bill,body.dark-mode .bill-panel{background:#1f2937;border-color:#374151;}
body.dark-mode .item-card,body.dark-mode .card-info{background:#1f2937;box-shadow:0 2px 8px rgba(0,0,0,.3);}
body.dark-mode .item-grid{background:#374151;}
body.dark-mode .card-name{color:#f3f4f6;}
body.dark-mode .card-price{color:#fbbf24;}
body.dark-mode .section-head{background:#111827;border-color:#374151;}
body.dark-mode .section.collapsed .section-pill{background:#1f2937;color:#fbbf24;border-color:#fbbf24;}
body.dark-mode .section-title{color:#fbbf24;}
body.dark-mode .mini-bill-top{color:#fbbf24;}
body.dark-mode .bill-head h3{color:#fbbf24;}
body.dark-mode .brand-text h1{color:#fbbf24;}
body.dark-mode .search-input,body.dark-mode .input,body.dark-mode .sheet{background:#1f2937;color:#e5e7eb;border-color:#374151;}
body.dark-mode .sheet-name{color:#f3f4f6;}
body.dark-mode .sheet-select,body.dark-mode .sheet-input{background:#111827;color:#e5e7eb;border-color:#374151;}
body.dark-mode .upsell-row{border-color:#374151;background:#1f2937;}
body.dark-mode .upsell-row.selected{background:#2a1a00;border-color:#f6a400;}
body.dark-mode .upsell-row-name{color:#d1d5db;}
body.dark-mode .upsell-row.selected .upsell-row-name{color:#fbbf24;}
body.dark-mode .category-chip{background:#374151;color:#f9fafb;}
body.dark-mode .category-chip.active{background:#f59e0b;color:#fff;}
body.dark-mode .bill-item-name{color:#f3f4f6;}
body.dark-mode .mini-bill-sub,body.dark-mode .mini-bill-last,body.dark-mode .bill-item-note,body.dark-mode .close-btn{color:#9ca3af;}
body.dark-mode .bill-total span{color:#f3f4f6;}
body.dark-mode .bill-item-price{color:#fbbf24;}
body.dark-mode .card-img-placeholder,body.dark-mode .sheet-img-placeholder{background:#111827;}
body.dark-mode .sheet-footer{border-color:#374151;}
body.dark-mode .sheet-qty-btn{border-color:#f6a400;color:#f6a400;background:#1f2937;}
body.dark-mode .sheet-qty-num{color:#f3f4f6;}
body.dark-mode .sheet-label,body.dark-mode .sheet-upsell-label{color:#9ca3af;}
body.dark-mode .loading-overlay{background:#111827;color:#fbbf24;}
body.dark-mode .btn-back-menu{background:#1f2937;color:#fbbf24;border-color:#f59e0b;}

    /* DÁN HOVER EFFECT Ở ĐÂY */

.item-card{
  transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease;
  overflow:hidden;
}

.card-img{
  overflow:hidden;
}

.card-img img{
  transition:transform .35s ease;
}

.item-card:hover{
  transform:translateY(-3px) scale(1.01);
  box-shadow:0 14px 30px rgba(0,0,0,.10);
}

.item-card:hover .card-img img{
  transform:scale(1.02);
}

.add-btn,
.item-add,
.card-add,
.add-to-cart{
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}

.add-btn:hover,
.item-add:hover,
.card-add:hover,
.add-to-cart:hover{
  transform:scale(1.08) rotate(2deg);
  box-shadow:0 8px 18px rgba(255,91,62,.25);
  border:1px solid rgba(255,91,62,.35);
}

.add-btn:active,
.item-add:active,
.card-add:active,
.add-to-cart:active{
  transform:scale(.94);
}

    /* ===== POPUP SHEET UI GIỐNG MẪU ===== */
.sheet{
  max-width:px;
  border-radius:28px 28px 0 0;
  background:#fff;
  box-shadow:0 -20px 50px rgba(0,0,0,.18);
}

.sheet-handle{
  width:48px;
  height:4px;
  background:#e5e0dc;
  margin:16px auto 20px;
}

.sheet-body{
  padding:0 26px 28px;
}

.sheet-img,
.sheet-img-placeholder{
  width:100px;
  height:100px;
  border-radius:22px;
}

.sheet-name{
  font-size:18px;
  font-weight:700;
  color:#111827;
  letter-spacing:-.04em;
}

.sheet-price{
  font-size:20px;
  font-weight:700;
  color:#ff5a3d;
}

/* dòng thông tin món */
.sheet-body > div:nth-child(2){
  border-bottom:none!important;
  padding-bottom:22px!important;
}

/* label */
.sheet-label,
.sheet-upsell-label{
  color:#6b7280;
  font-size:14px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.04em;
  margin:18px 0 8px;
}

/* select */
.sheet-select,
.sheet-input{
  height:50px;
  border:1px solid #eee3dc;
  border-radius:999px;
  padding:0 18px;
  font-size:16px!important;
  background:#fff;
  color:#1f2937;
}

.sheet-select:focus,
.sheet-input:focus{
  border-color:#ffb49d;
  box-shadow:0 0 0 4px rgba(255,120,90,.12);
}

/* upsell item */
.upsell-list{
  gap:10px;
}

.upsell-row{
  min-height:58px;
  border:1px solid #eee3dc;
  border-radius:20px;
  background:#fff;
  padding:0 18px;
  transition:.18s ease;
}

.upsell-row:hover{
  border-color:#ffb49d;
  transform:translateY(-1px);
  box-shadow:0 6px 16px rgba(0,0,0,.04);
}

.upsell-row.selected{
  background:#fff;
  border-color:#ffb49d;
}

.upsell-check{
  width:24px;
  height:24px;
  border-radius:50%;
  border:2px solid #e7dfda;
}

.upsell-row.selected .upsell-check{
  background:#ff5a3d;
  border-color:#ff5a3d;
}

.upsell-row-name{
  font-size:17px;
  font-weight:500;
  color:#1f2937;
}

.upsell-row-price{
  color:#ff5a3d;
  font-size:16px;
  font-weight:800;
}

/* footer dưới */
.sheet-footer{
  gap:14px;
  border-top:none;
  padding:22px 0 calc(18px + env(safe-area-inset-bottom));
  background:#fff;
}

.sheet-qty-row{
  background:#f4f1ef;
  border-radius:999px;
  padding:8px 12px;
  gap:16px;
}

.sheet-qty-btn{
  width:28px;
  height:28px;
  border:none;
  background:transparent;
  color:#111827;
  font-size:22px!important;
}

.sheet-qty-num{
  font-size:17px;
  font-weight:700;
  color:#111827;
}

.sheet-add-btn{
  height:60px;
  border-radius:999px;
  background:linear-gradient(135deg,#ff653d,#dc3f78);
  box-shadow:0 10px 24px rgba(255,90,70,.25);
  font-size:17px;
  font-weight:800;
  transition:.2s ease;
}

.sheet-add-btn:hover{
  transform:translateY(-1px);
  box-shadow:0 14px 30px rgba(255,90,70,.32);
}

.sheet-add-btn:active{
  transform:scale(.98);
}
    .sheet-options-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:14px;
}

.sheet-options-grid.one-col{
  grid-template-columns:1fr;
}

.sheet-field{
  min-width:0;
}

.sheet-select{
  width:100%;
}

let categories = [...new Set(products.map(p => p.category))];
let cart = [];
let orderTime = null;
let currentSearch = "";
const collapsedCategories = {};

// ── SHEET STATE ──
let sheetPid = null;
let sheetQtyVal = 1;
let sheetSelectedUpsells = new Set();

function slugify(str){ return "cat-"+String(str||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,""); }
function normalizeText(str){ return String(str||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").trim(); }
function formatPrice(p){ return p?p.toLocaleString("vi-VN")+"đ":"0đ"; }
function formatOrderTime(date){ if(!date)return""; const d=new Date(date); return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear()+" - "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function scrollToTop(){ window.scrollTo({top:0,behavior:"smooth"}); }
function matchesSearch(p,kw){ if(!kw)return true; const h=normalizeText([p.name,p.category,p.id,...(p.options||[]).map(o=>o.label)].join(" ")); return h.includes(kw); }

function handleSearchInput(v){
  currentSearch=normalizeText(v);
  renderMenu(); renderCategoryBar();
}

// ── CATEGORY BAR ──
function renderCategoryBar(){ /* disabled */ }

function scrollToCategory(id){
  const el=document.getElementById(id); if(!el)return;
  const cat=el.getAttribute("data-category");
  if(cat){collapsedCategories[cat]=false;renderMenu();}
  const el2=document.getElementById(id); if(!el2)return;
  window.scrollTo({top:el2.getBoundingClientRect().top+window.pageYOffset-115,behavior:"smooth"});
}

function updateActiveCategoryOnScroll(){
  const secs=document.querySelectorAll(".section");
  const chips=document.querySelectorAll(".category-chip");
  let curId="";
  secs.forEach(s=>{const r=s.getBoundingClientRect();if(r.top<=140&&r.bottom>=140)curId=s.id;});
  chips.forEach(ch=>{ch.classList.remove("active");if(ch.dataset.target===curId)ch.classList.add("active");});
}

// ── RENDER MENU ──
function renderMenu(){
  renderCategoryBar();
  const vis=categories.filter(c=>products.some(p=>p.category===c&&matchesSearch(p,currentSearch)));
  if(!vis.length){
    document.getElementById("menuContainer").innerHTML=`<div style="padding:24px;text-align:center;color:#888;font-size:14px;">Không tìm thấy món phù hợp 🔍</div>`;
    return;
  }
  document.getElementById("menuContainer").innerHTML=vis.map(cat=>{
    const id=slugify(cat);
    const items=products.filter(p=>p.category===cat&&matchesSearch(p,currentSearch));
    const collapsed=!!collapsedCategories[cat]&&!currentSearch;
    return `<div class="section${collapsed?" collapsed":""}" id="${id}" data-category="${cat}">
      <div class="section-head" onclick="toggleCollapse('${cat.replace(/'/g,"\\'")}')">
        <h2 class="section-title">${cat}</h2>
        <div class="section-pill"><span class="section-pill-text-open">Thu gọn ↑</span><span class="section-pill-text-close">Xem thêm ↓</span></div>
      </div>
      <div class="item-grid">
        ${items.map(p=>{
          const qty=cart.filter(i=>i.productId===p.id).reduce((s,i)=>s+i.qty,0);
          const imgHTML=p.image&&!p.image.startsWith("LINK_")?`<img src="${p.image}" alt="${p.name}" loading="lazy"/>`:`<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#c8a96a;">Doremi</div>`;
          return `<div class="item-card${matchesSearch(p,currentSearch)?"":" hidden-by-search"}" data-product-id="${p.id}">
            <div class="card-img" onclick="openSheet('${p.id}')">
              ${imgHTML}
              <div class="card-qty-badge${qty>0?" show":""}" id="badge-${p.id}">${qty}</div>
              ${(p.customizable||p.options)
                ? `<button class="card-plus" onclick="event.stopPropagation();handlePlusClick('${p.id}')">+</button>`
                : `<div class="card-qty-controls" id="ctrl-${p.id}" style="${qty>0?'':'display:none;'}">
                    <button class="card-qbtn" onclick="event.stopPropagation();cardMinus('${p.id}')">−</button>
                    <span class="card-qnum" id="cnum-${p.id}">${qty}</span>
                    <button class="card-qbtn" onclick="event.stopPropagation();cardPlus('${p.id}')">+</button>
                   </div>
                   <button class="card-plus" id="cplus-${p.id}" onclick="event.stopPropagation();handlePlusClick('${p.id}')" style="${qty>0?'display:none;':''}">+</button>`
              }
            </div>
            <div class="card-info" onclick="openSheet('${p.id}')">
              <div class="card-name">${p.name}</div>
              <div class="card-price">${formatPrice(p.basePrice)}</div>
            </div>
          </div>`;
        }).join("")}
      </div>
    </div>`;
  }).join("");
}

function toggleCollapse(cat){
  collapsedCategories[cat]=!collapsedCategories[cat];
  renderMenu();
}

// ── PLUS BUTTON LOGIC ──
// Nếu món đơn giản (không customizable, không upsell, không options) → thêm luôn
// Ngược lại → mở sheet
function handlePlusClick(pid){ openSheet(pid); }

function cardPlus(pid){
  const p=products.find(i=>i.id===pid); if(!p)return;
  if(!orderTime)orderTime=new Date();
  const noteEl=document.getElementById("cnote-"+pid);
  const note=noteEl?noteEl.value.trim():"";
  const iceEl=document.getElementById("cice-"+pid);
  const ice=iceEl?iceEl.value:"N/A";
  const key=pid+"-default";
  const found=cart.find(i=>i.key===key);
  if(found){found.qty++;found.customNote=note;if(iceEl)found.ice=ice;}
  else{cart.push({key,productId:pid,name:p.name,optionLabel:"Mặc định",price:p.basePrice,ice:ice,sugar:"N/A",customNote:note,upsellLabels:[],qty:1});}
  updateAll(); updateCardControls(pid); shakeMiniBtn();
}

function cardMinus(pid){
  const key=pid+"-default";
  const found=cart.find(i=>i.key===key);
  if(!found)return;
  found.qty--;
  if(found.qty<=0)cart=cart.filter(i=>i.key!==key);
  updateAll(); updateCardControls(pid);
}

function syncCardIce(pid, ice){
  const key=pid+"-default";
  const found=cart.find(i=>i.key===key);
  if(found){found.ice=ice;}
}

function syncCardNote(pid, note){
  const key=pid+"-default";
  const found=cart.find(i=>i.key===key);
  if(found){found.customNote=note.trim();}
}

function updateCardControls(pid){
  const qty=cart.filter(i=>i.productId===pid).reduce((s,i)=>s+i.qty,0);
  const ctrl=document.getElementById("ctrl-"+pid);
  const plusBtn=document.getElementById("cplus-"+pid);
  const cnum=document.getElementById("cnum-"+pid);
  if(ctrl){ctrl.style.display=qty>0?"flex":"none";}
  if(plusBtn){plusBtn.style.display=qty>0?"none":"";}
  if(cnum){cnum.textContent=qty;}
}

function quickAddToCart(pid){
  const p=products.find(i=>i.id===pid); if(!p)return;
  if(!orderTime)orderTime=new Date();
  const key=`${pid}-default`;
  const found=cart.find(i=>i.key===key);
  if(found){found.qty++;}else{cart.push({key,productId:pid,name:p.name,optionLabel:"Mặc định",price:p.basePrice,ice:"N/A",sugar:"N/A",customNote:"",upsellLabels:[],qty:1});}
  updateAll();
  animateBadge(pid);
  shakeMiniBtn();
}

// ── BOTTOM SHEET ──
function openSheet(pid){
  const p=products.find(i=>i.id===pid); if(!p)return;
  sheetPid=pid;
  sheetQtyVal=1;
  sheetSelectedUpsells=new Set();

  // Ảnh
  const imgWrap=document.getElementById("sheetImgWrap");
  if(p.image&&!p.image.startsWith("LINK_")){
    imgWrap.innerHTML=`<img class="sheet-img" src="${p.image}" alt="${p.name}" crossorigin="anonymous"/>`;
  } else {
    imgWrap.innerHTML=`<div class="sheet-img-placeholder">🍹 Doremi</div>`;
  }

  document.getElementById("sheetName").textContent=p.name;
  document.getElementById("sheetPrice").textContent=formatPrice(p.basePrice);
  document.getElementById("sheetQty").textContent=sheetQtyVal;

 // Controls (đá/đường/options/ghi chú)
let ctrl="";

if(p.options){
  ctrl+=`
    <div class="sheet-label">Chọn loại</div>
    <select class="sheet-select" id="sh-option">
      ${p.options.map(o=>`<option value="${o.price}">${o.label} - ${formatPrice(o.price)}</option>`).join("")}
    </select>`;
}

if(p.category==="Chè"){

  ctrl+=`
    <div class="sheet-options-grid one-col">

      <div class="sheet-field">
        <div class="sheet-label">Đá</div>
        <select class="sheet-select" id="sh-ice">
          <option>Đá chung</option>
          <option>Đá riêng</option>
          <option>Không đá</option>
        </select>
      </div>

    </div>`;

} else if(p.customizable){

  ctrl+=`
    <div class="sheet-options-grid">

      <div class="sheet-field">
        <div class="sheet-label">Đá</div>
        <select class="sheet-select" id="sh-ice">
          <option>Đá: Bình thường</option>
          <option>Đá: Ít đá</option>
          <option>Đá: Không đá</option>
          <option>Đá: Đá riêng</option>
        </select>
      </div>

      <div class="sheet-field">
        <div class="sheet-label">Đường</div>
        <select class="sheet-select" id="sh-sugar">
          <option>Đường: Bình thường</option>
          <option>Đường: Ít đường</option>
          <option>Đường: Không đường</option>
        </select>
      </div>

    </div>`;
}

ctrl+=`
  <div class="sheet-label">Ghi chú</div>
  <input
    type="text"
    class="sheet-input"
    id="sh-note"
    placeholder="Ghi chú thêm cho Doremi..."
  />`;

document.getElementById("sheetControls").innerHTML=ctrl;

// Gắn event để sync qty khi đổi cấu hình
["sh-ice","sh-sugar","sh-option"].forEach(id=>{
  const el=document.getElementById(id);
  if(el){
    el.addEventListener("change",()=>{
      setTimeout(syncSheetQtyFromCart,10);
    });
  }
});
  // Upsell
  let upsellHTML="";
  if(p.upsells&&p.upsells.length){
    upsellHTML=`<div class="sheet-upsell-label">🍟 Thêm vào đơn</div><div class="upsell-list">
      ${p.upsells.map(key=>{
        const def=UPSELL_DEFS[key]; if(!def)return"";
        return `<div class="upsell-row" id="urow-${def.id}" onclick="toggleSheetUpsell('${def.id}')">
          <div class="upsell-row-left">
            <div class="upsell-check">✓</div>
            <div class="upsell-row-name">${def.label}</div>
          </div>
          <div class="upsell-row-price">+${formatPrice(def.price)}</div>
        </div>`;
      }).join("")}
    </div>`;
  }
  document.getElementById("sheetUpsell").innerHTML=upsellHTML;

  updateSheetBtn();
  // Sau khi render xong, tính key thực tế và load qty nếu đã có trong giỏ
  setTimeout(()=>{
    syncSheetQtyFromCart();
    renderSheetCartSummary(pid);
  },50);

  document.getElementById("sheetOverlay").classList.add("open");
  document.getElementById("sheet").classList.add("open");
  document.body.style.overflow="hidden";
}

function closeSheet(){
  document.getElementById("sheetOverlay").classList.remove("open");
  document.getElementById("sheet").classList.remove("open");
  document.body.style.overflow="";
  const sum=document.getElementById("sheetCartSummary");
  if(sum){sum.style.display="none";sum.innerHTML="";}
  sheetPid=null;
}

function toggleSheetUpsell(defId){
  if(sheetSelectedUpsells.has(defId))sheetSelectedUpsells.delete(defId);
  else sheetSelectedUpsells.add(defId);
  const row=document.getElementById("urow-"+defId);
  if(row)row.classList.toggle("selected",sheetSelectedUpsells.has(defId));
  updateSheetBtn();
}

function sheetQtyChange(delta){
  sheetQtyVal=Math.max(0,sheetQtyVal+delta);
  const qtyEl=document.getElementById("sheetQty");
  if(qtyEl)qtyEl.textContent=sheetQtyVal;
  const minusBtn=document.querySelector(".sheet-qty-btn");
  if(minusBtn)minusBtn.style.opacity=sheetQtyVal<=0?"0.35":"1";
  updateSheetBtn();
}

function renderSheetCartSummary(pid){
  const items=cart.filter(i=>i.productId===pid);
  if(!items.length){ const el=document.getElementById("sheetCartSummary"); if(el){el.style.display="none";el.innerHTML="";} return; }
  const el=document.getElementById("sheetCartSummary");
  if(!el) return;
  const p2=products.find(i=>i.id===pid);
  const unit=(p2&&["Bánh Tráng","Ăn Vặt"].includes(p2.category))?"phần":"ly";
  const total=items.reduce((s,i)=>s+i.qty,0);
  const rows=items.map(i=>{
    const parts=[];
    if(i.ice&&i.ice!=="N/A") parts.push(i.ice);
    if(i.sugar&&i.sugar!=="N/A") parts.push(i.sugar);
    if(i.upsellLabels&&i.upsellLabels.length) parts.push("+"+i.upsellLabels.join(", +"));
    if(i.customNote) parts.push(i.customNote);
    const label=parts.length?parts.join(" · "):"Mặc định";
    return `<div class="sheet-cart-row"><span>${i.qty} ${unit} · ${label}</span><span>${(i.qty*i.price).toLocaleString("vi-VN")}đ</span></div>`;
  }).join("");
  el.innerHTML=`<div class="sheet-cart-summary-title">🛒 Đang có ${total} ${unit} trong giỏ:</div>${rows}`;
  el.style.display="block";
}

function getSheetCurrentKey(){
  // Tính key dựa trên các giá trị đang chọn trong sheet
  if(!sheetPid) return null;
  const p=products.find(i=>i.id===sheetPid); if(!p) return null;
  const optEl=document.getElementById("sh-option");
  const optLabel=optEl?optEl.options[optEl.selectedIndex]?.text.split(" - ")[0]:"Mặc định";
  const iceEl=document.getElementById("sh-ice");
  const sugarEl=document.getElementById("sh-sugar");
  const noteEl=document.getElementById("sh-note");
  const ice=iceEl?iceEl.value:"N/A";
  const sugar=sugarEl?sugarEl.value:"N/A";
  const customNote=noteEl?noteEl.value.trim():"";
  const upsellKey=Array.from(sheetSelectedUpsells).join("|");
  return sheetPid+"-"+optLabel+"-"+ice+"-"+sugar+"-"+customNote+"-"+upsellKey;
}

function syncSheetQtyFromCart(){
  const key=getSheetCurrentKey();
  if(!key) return;
  const found=cart.find(i=>i.key===key);
  sheetQtyVal=found?found.qty:1;
  const qtyEl=document.getElementById("sheetQty");
  if(qtyEl)qtyEl.textContent=sheetQtyVal;
  const minusBtn=document.querySelector(".sheet-qty-btn");
  if(minusBtn)minusBtn.style.opacity=sheetQtyVal<=0?"0.35":"1";
  updateSheetBtn();
}

function updateSheetBtn(){
  const p=products.find(i=>i.id===sheetPid); if(!p)return;
  let basePrice=p.basePrice;
  const optEl=document.getElementById("sh-option");
  if(optEl&&optEl.value)basePrice=Number(optEl.value)||p.basePrice;
  const upsellPrice=Array.from(sheetSelectedUpsells).reduce((s,id)=>{
    const def=Object.values(UPSELL_DEFS).find(d=>d.id===id); return s+(def?def.price:0);
  },0);
  const total=(basePrice+upsellPrice)*sheetQtyVal;
  const btn=document.getElementById("sheetAddBtn");
  if(btn){
    if(sheetQtyVal===0){
      btn.textContent="Xóa khỏi giỏ";
      btn.style.background="#fee2e2";
      btn.style.color="#dc2626";
      btn.style.boxShadow="none";
    } else {
      // Kiểm tra xem cấu hình hiện tại đã có trong giỏ chưa
      const curKey=getSheetCurrentKey();
      const alreadyInCart=curKey&&cart.some(i=>i.key===curKey);
      if(alreadyInCart){
        btn.textContent="Cập nhật giỏ hàng - "+formatPrice(total);
        btn.style.background="linear-gradient(135deg,#34d399,#059669)";
        btn.style.color="#fff";
        btn.style.boxShadow="0 4px 12px rgba(5,150,105,.3)";
      } else {
        btn.textContent="Thêm "+sheetQtyVal+" vào giỏ - "+formatPrice(total);
        btn.style.background="";
        btn.style.color="";
        btn.style.boxShadow="";
      }
    }
  }
}

function sheetConfirmAdd(){
  const p=products.find(i=>i.id===sheetPid); if(!p)return;
  if(sheetQtyVal===0){
    const curKey=getSheetCurrentKey();
    if(curKey) cart=cart.filter(i=>i.key!==curKey);
    else cart=cart.filter(i=>i.productId!==sheetPid);
    updateAll(); animateBadge(sheetPid);
    // Cập nhật lại summary sau khi xóa
    renderSheetCartSummary(sheetPid);
    // Nếu giỏ không còn item nào của món này thì đóng sheet
    if(!cart.some(i=>i.productId===sheetPid)) closeSheet();
    return;
  }
  let basePrice=p.basePrice;
  const optEl=document.getElementById("sh-option");
  const optLabel=optEl?optEl.options[optEl.selectedIndex].text.split(" - ")[0]:"Mặc định";
  if(optEl)basePrice=Number(optEl.value)||p.basePrice;

  const iceEl=document.getElementById("sh-ice");
  const sugarEl=document.getElementById("sh-sugar");
  const noteEl=document.getElementById("sh-note");
  const ice=iceEl?iceEl.value:"N/A";
  const sugar=sugarEl?sugarEl.value:"N/A";
  const customNote=noteEl?noteEl.value.trim():"";

  const upsellDefs=Array.from(sheetSelectedUpsells).map(id=>Object.values(UPSELL_DEFS).find(d=>d.id===id)).filter(Boolean);
  const upsellLabels=upsellDefs.map(d=>d.label);
  const upsellPrice=upsellDefs.reduce((s,d)=>s+d.price,0);
  const finalPrice=basePrice+upsellPrice;

  const key=`${sheetPid}-${optLabel}-${ice}-${sugar}-${customNote}-${Array.from(sheetSelectedUpsells).join("|")}`;

  if(!orderTime)orderTime=new Date();
  // Chỉ update item có cùng key (cùng đá/đường/ghi chú)
  // Cho phép cùng món có nhiều cấu hình khác nhau
  const existingIdx=cart.findIndex(i=>i.key===key);
  if(existingIdx>=0){
    if(sheetQtyVal>0){
      cart[existingIdx].qty=sheetQtyVal;
    } else {
      cart.splice(existingIdx,1);
    }
  } else if(sheetQtyVal>0){
    cart.push({key,productId:sheetPid,name:p.name,optionLabel:optLabel,price:finalPrice,ice,sugar,customNote,upsellLabels,qty:sheetQtyVal});
  }

  updateAll();
  animateBadge(sheetPid);
  shakeMiniBtn();
  closeSheet();
}

// ── CART / UI UPDATE ──
function animateBadge(pid){
  const badge=document.getElementById("badge-"+pid); if(!badge)return;
  const qty=cart.filter(i=>i.productId===pid).reduce((s,i)=>s+i.qty,0);
  badge.textContent=qty;
  badge.classList.toggle("show",qty>0);
}

function shakeMiniBtn(){
  const btn=document.querySelector(".mini-bill-btn");
  if(btn){btn.classList.add("shake");setTimeout(()=>btn.classList.remove("shake"),400);}
}

function updateAll(){
  // Cập nhật badge tất cả sản phẩm
  products.forEach(p=>{
    const badge=document.getElementById("badge-"+p.id); if(!badge)return;
    const qty=cart.filter(i=>i.productId===p.id).reduce((s,i)=>s+i.qty,0);
    badge.textContent=qty;
    badge.classList.toggle("show",qty>0);
  });

  const totalP=cart.reduce((s,i)=>s+i.qty*i.price,0);
  const totalQ=cart.reduce((s,i)=>s+i.qty,0);

  // Mini bill
  document.getElementById("cartCount").textContent=totalQ;
  document.getElementById("miniBillTop").textContent=totalQ+" món - "+formatPrice(totalP);

  // Mini bill last items
  const lastEl=document.getElementById("miniBillLast");
  if(!cart.length){lastEl.innerHTML="";}
  else{
    lastEl.innerHTML=cart.slice(-3).reverse().map(i=>{
      const extras=[];
      if(i.optionLabel&&i.optionLabel!=="Mặc định")extras.push(i.optionLabel);
      if(i.upsellLabels&&i.upsellLabels.length)extras.push("+"+i.upsellLabels.join(", +"));
      return `<div>+${i.qty} ${i.name}${extras.length?" ("+extras.join(", ")+")":""} · ${formatPrice(i.qty*i.price)}</div>`;
    }).join("");
  }

  // Bill order time
  const btEl=document.getElementById("billOrderTime");
  if(btEl){if(orderTime&&cart.length){btEl.style.display="block";btEl.innerHTML=`⏰ Order: <strong>${formatOrderTime(orderTime)}</strong>`;}else btEl.style.display="none";}

  // Bill items
  const billItems=document.getElementById("billItems");
  billItems.innerHTML=cart.length?cart.map((item,idx)=>`
    <div class="bill-item">
      <div class="bill-item-top">
        <div class="bill-item-name">${idx+1}. ${item.name} x${item.qty}</div>
        <div class="bill-item-price">${formatPrice(item.qty*item.price)}</div>
      </div>
      <div class="bill-item-note">
        ${item.optionLabel!=="Mặc định"?`• ${item.optionLabel} `:""}
        ${item.ice!=="N/A"?`• ${item.ice} `:""}
        ${item.sugar!=="N/A"?`| ${item.sugar} `:""}
        ${item.upsellLabels&&item.upsellLabels.length?`<br><span style="color:#f6a400;">• Thêm: ${item.upsellLabels.join(", ")}</span>`:""}
        ${item.customNote?`<br><span style="color:#d97706;">• Ghi chú: ${item.customNote}</span>`:""}
      </div>
    </div>`).join(""):`<div class="bill-empty">Giỏ hàng đang trống</div>`;

  document.getElementById("billTotal").textContent=formatPrice(totalP);
}

function toggleBill(show){
  document.getElementById("billPanel").style.display=show?"block":"none";
  const fa=document.getElementById("floatActions");
  if(fa)fa.style.display=show?"none":"";
}

function clearCart(skipConfirm=false){
  if(!skipConfirm&&!confirm("Xoá toàn bộ đơn?"))return;
  cart=[];orderTime=null;
  const cb=document.getElementById("customerBlock");if(cb)cb.value="";
  const pm=document.getElementById("paymentMethod");if(pm)pm.value="Chuyển khoản";
  updateAll();toggleBill(false);
}

function restoreDarkMode(){
  if(localStorage.getItem("doremiDarkMode")==="1")document.body.classList.add("dark-mode");
}

window.addEventListener("scroll",()=>{
  const fa=document.getElementById("floatActions");
  if(fa){if(window.scrollY>220)fa.classList.add("show");else fa.classList.remove("show");}
  updateActiveCategoryOnScroll();
});

='padding:20px;text-align:center;color:#888;'>Dữ liệu lỗi.</p>";return;}var itemsData=Array.isArray(d.itemsData)?d.itemsData:[];document.getElementById("info").innerHTML="⏰ Đặt lúc: <strong>"+(d.orderTimeStr||"")+"</strong><br>📍 Địa chỉ: <strong>"+(d.block||"")+"</strong><br>💳 Thanh toán: <strong>"+(d.payment||"")+"</strong>";document.getElementById("items").innerHTML=itemsData.map(function(i,idx){var notes=Array.isArray(i.notes)?i.notes:[];var qty=Number(i.qty||0),price=Number(i.price||0);var noteHTML=notes.length?'<div class="item-note">'+notes.join(" | ")+"</div>":"";return'<div class="item"><div class="item-l"><div class="item-n">'+(i.n||idx+1)+". "+i.name+" × "+qty+"</div>"+noteHTML+"</div>"+'<div class="item-p">'+(qty*price).toLocaleString("vi-VN")+"đ</div></div>";}).join("");document.getElementById("totL").textContent="Tổng ("+Number(d.totalQty||0)+" món)";document.getElementById("totV").textContent=Number(d.total||0).toLocaleString("vi-VN")+"đ";document.getElementById("pmBadge").textContent="💳 "+(d.payment||"");var TS=Number(d.orderTimestamp||Date.now());var now=Date.now();var elapsed=Math.max(0,now-TS);var T={prep:5*1000,deliver:10*1000+10*60000,done:5*1000+10*60000+7*60000};var totalRemaining=Math.max(0,T.done-elapsed);var deliverTime=new Date(TS+T.done);var deliverTimeStr=String(deliverTime.getHours()).padStart(2,"0")+":"+String(deliverTime.getMinutes()).padStart(2,"0");document.getElementById("countdown").textContent="Dự kiến giao lúc: "+deliverTimeStr;var currentStep;if(elapsed<T.prep)currentStep=1;else if(elapsed<T.deliver)currentStep=2;else if(elapsed<T.done)currentStep=3;else currentStep=4;function setDone(di,li){var dot=document.getElementById(di);var lbl=document.getElementById(li);if(dot)dot.className="sd d";if(lbl)lbl.className="sl d";}function setActive(di,li){var dot=document.getElementById(di);var lbl=document.getElementById(li);if(dot)dot.className="sd a pulse";if(lbl)lbl.className="sl a";}function setIdle(di,li){var dot=document.getElementById(di);var lbl=document.getElementById(li);if(dot)dot.className="sd";if(lbl)lbl.className="sl";}setDone("d1","l1");if(currentStep===1){setActive("d1","l1");setIdle("d2","l2");setIdle("d3","l3");setIdle("d4","l4");}else if(currentStep===2){setDone("d1","l1");setActive("d2","l2");setIdle("d3","l3");setIdle("d4","l4");}else if(currentStep===3){setDone("d1","l1");setDone("d2","l2");setActive("d3","l3");setIdle("d4","l4");}else{setDone("d1","l1");setDone("d2","l2");setDone("d3","l3");setDone("d4","l4");}var etaEl=document.getElementById("eta");var stepTextEl=document.getElementById("stepText");var stepSubEl=document.getElementById("stepSub");var minsLeft=Math.max(1,Math.ceil(totalRemaining/60000));if(currentStep===1){etaEl.innerHTML="🍵 Dự kiến giao sau <strong>~"+minsLeft+" phút</strong>";stepTextEl.textContent="Đơn đã được ghi nhận";stepSubEl.textContent="Doremi đang xử lý cho bạn nhé";}else if(currentStep===2){etaEl.innerHTML="🍵 Giao trong <strong>~"+minsLeft+" phút</strong>!";stepTextEl.textContent="🍵 Đang chuẩn bị món";stepSubEl.textContent="Hàng xóm chờ xíu nha 💛";}else if(currentStep===3){etaEl.innerHTML="🛵 <strong>Đang trên đường giao!</strong> Chuẩn bị mở cửa nha 🎉";stepTextEl.textContent="🛵 Đang trên đường giao";stepSubEl.textContent="Chuẩn bị mở chuông cửa nha 🎉";}else{etaEl.innerHTML="<strong>Đã giao xong!</strong> Cảm ơn bạn ❤️";stepTextEl.textContent="Đơn đã giao thành công";stepSubEl.textContent="Cảm ơn bạn đã ủng hộ Doremi ❤️";document.getElementById("countdown").textContent="Đơn đã hoàn tất ✅";}if(totalRemaining>0){var pf=document.getElementById("pf");var currentPct;if(currentStep===1)currentPct=8*(elapsed/T.prep);else if(currentStep===2)currentPct=8+37*((elapsed-T.prep)/(T.deliver-T.prep));else if(currentStep===3)currentPct=45+35*((elapsed-T.deliver)/(T.done-T.deliver));else currentPct=100;currentPct=Math.min(100,Math.max(0,currentPct));pf.style.width=currentPct+"%";pf.style.transition="width "+(totalRemaining/1000).toFixed(1)+"s linear";requestAnimationFrame(function(){requestAnimationFrame(function(){pf.style.width="100%";});});if(currentStep<2){var d2=document.getElementById("d2");var l2=document.getElementById("l2");var delay2=(T.prep-elapsed)/1000;d2.style.cssText+="animation-name:dotActiveToDone;animation-duration:"+((T.deliver-T.prep)/1000).toFixed(1)+"s;animation-delay:"+delay2.toFixed(2)+"s;animation-timing-function:step-start;animation-fill-mode:both;";d2.className="sd dot-anim";l2.style.cssText+="animation-name:labelActiveToDone;animation-duration:"+((T.deliver-T.prep)/1000).toFixed(1)+"s;animation-delay:"+delay2.toFixed(2)+"s;animation-timing-function:step-start;animation-fill-mode:both;";l2.className="sl label-anim";}if(currentStep<3){var d3=document.getElementById("d3");var l3=document.getElementById("l3");var delay3=(T.deliver-elapsed)/1000;d3.style.cssText+="animation-name:dotActiveToDone;animation-duration:"+((T.done-T.deliver)/1000).toFixed(1)+"s;animation-delay:"+delay3.toFixed(2)+"s;animation-timing-function:step-start;animation-fill-mode:both;";d3.className="sd dot-anim";l3.style.cssText+="animation-name:labelActiveToDone;animation-duration:"+((T.done-T.deliver)/1000).toFixed(1)+"s;animation-delay:"+delay3.toFixed(2)+"s;animation-timing-function:step-start;animation-fill-mode:both;";l3.className="sl label-anim";}if(currentStep<4){var d4=document.getElementById("d4");var delay4=(T.done-elapsed)/1000;d4.style.cssText+="animation-name:dotActiveToDone;animation-duration:1s;animation-delay:"+delay4.toFixed(2)+"s;animation-timing-function:step-start;animation-fill-mode:both;";d4.className="sd dot-anim";}}})();<\/script></body></html>`;

function buildSheetPayload(){
  const block=document.getElementById("customerBlock")?.value.trim()||"";
  const payment=document.getElementById("paymentMethod")?.value||"";
  const items=cart.map(i=>{
    const n=[];
    if(i.optionLabel&&i.optionLabel!=="Mặc định")n.push(i.optionLabel);
    if(i.ice&&i.ice!=="N/A")n.push(i.ice);
    if(i.sugar&&i.sugar!=="N/A")n.push(i.sugar);
    if(i.upsellLabels&&i.upsellLabels.length)n.push("Thêm: "+i.upsellLabels.join(", "));
    if(i.customNote)n.push("Ghi chú: "+i.customNote);
    return{name:i.name,qty:i.qty,price:i.price,note:n.join(" | ")};
  });
  return{block,payment,items};
}

let isSavingOrder=false;
async function saveOrderToSheet(){
  if(!cart.length){alert("Chưa có món nào!");return;}
  if(isSavingOrder)return;
  const block=document.getElementById("customerBlock").value.trim();
  if(!block){alert("Bạn chưa nhập SĐT & Số Căn!");document.getElementById("customerBlock").focus();toggleBill(true);return;}

  openBillTab();

  const btn=document.getElementById("saveBtn");
  const oldText=btn.innerHTML;
  isSavingOrder=true;btn.disabled=true;
  let cd=5;btn.innerHTML=`⏳ Đang lưu... (${cd}s)`;
  const timer=setInterval(()=>{cd--;if(cd>=0)btn.innerHTML=`⏳ Đang lưu... (${cd}s)`;},1000);

  try{
    const payload=buildSheetPayload();
    const now=new Date();
    const timeStr=now.toLocaleString("vi-VN",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
    document.getElementById("captureOrderTime").innerHTML="⏰ Đặt lúc: "+timeStr;
    document.getElementById("captureCustomerInfo").innerHTML=`🏢 Block: ${payload.block||""}<br>💳 Thanh toán: ${payload.payment||""}`;
    document.getElementById("captureItems").innerHTML=payload.items.map(i=>`<div class="item-row"><div><div class="item-name">${i.name} x${i.qty}</div><div class="item-note">${i.note}</div></div><div style="white-space:nowrap;padding-left:8px;">${((i.qty||0)*(i.price||0)).toLocaleString("vi-VN")}đ</div></div>`).join("");
    document.getElementById("captureTotal").innerText=payload.items.reduce((s,i)=>s+(i.qty||0)*(i.price||0),0).toLocaleString("vi-VN")+"đ";
    await new Promise(r=>setTimeout(r,500));
    await fetch(SHEET_WEBAPP_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    await sendBillImageToTelegram();
    clearInterval(timer);btn.innerHTML="✅ Đã gửi đơn";
    alert("Đã gửi đơn thành công! Doremi chuẩn bị ngay nhé 🎉");
    clearCart(true);
    setTimeout(()=>{btn.disabled=false;btn.innerHTML=oldText;isSavingOrder=false;},1200);
  }catch(e){
    clearInterval(timer);btn.innerHTML="❌ Lỗi, thử lại";
    setTimeout(()=>{btn.disabled=false;btn.innerHTML=oldText;isSavingOrder=false;},1500);
  }
}

async function sendBillImageToTelegram(){
  const billEl=document.getElementById("captureBill");if(!billEl)return;
  await new Promise(r=>setTimeout(r,1800));
  const canvas=await html2canvas(billEl,{scale:1.3,useCORS:true,backgroundColor:"#ffffff"});
  await fetch(SHEET_WEBAPP_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"send_bill_image",billImage:canvas.toDataURL("image/png"),caption:"🧾 Bill đơn hàng mới"})});
}

  currentSearch="";
  Object.keys(collapsedCategories).forEach(k=>collapsedCategories[k]=false);
  renderMenu(); renderCategoryBar();

}
